<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduMetrics | Forgot Password</title>
    <link rel="stylesheet" href="/Static/style.css">

    <style>
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper .forgot-input {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            padding: 4px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: #64748B;
            cursor: pointer;
        }

        .toggle-password:hover {
            color: #D99A00;
            background: #FFF4CC;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .toggle-password:focus-visible {
            outline: 2px solid #F4B400;
            outline-offset: 2px;
        }

        .forgot-reset-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 18px;
            background: #F1EDE7;
            font-family: Arial, Helvetica, sans-serif;
        }

        .forgot-reset-card {
            width: min(100%, 1000px);
            display: grid;
            grid-template-columns: 0.85fr 1.15fr;
            overflow: hidden;
            border-radius: 20px;
            background: white;
            box-shadow: 0 12px 35px rgba(0, 0, 0, .12);
        }

        .forgot-brand {
            background: #004179;
            color: white;
            padding: 45px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .forgot-brand h1 {
            font-size: 35px;
            line-height: 1.2;
            margin: 0 0 18px;
        }

        .forgot-brand p {
            font-size: 17px;
            line-height: 1.7;
        }

        .forgot-form-panel {
            padding: 45px 38px;
            min-width: 0;
        }

        .forgot-form-panel h2 {
            color: #004179;
            font-size: 30px;
            margin: 0 0 12px;
        }

        .forgot-description {
            color: #64748B;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .forgot-field {
            display: block;
            width: 100%;
            margin: 16px 0 7px;
            color: #004179;
            font-weight: 600;
        }

        .forgot-input {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid #8BAFD1;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            color: #17324D;
        }

        .forgot-input:focus {
            outline: 2px solid #F4B400;
            outline-offset: 1px;
        }

        .forgot-button {
            display: block;
            width: 100%;
            min-height: 48px;
            margin-top: 20px;
            padding: 12px;
            border: 0;
            border-radius: 26px;
            background: #004179;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .forgot-button:hover {
            background: #00345F;
        }

        .forgot-button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .forgot-otp-row {
            display: flex;
            justify-content: center;
            gap: 9px;
            margin: 24px 0 8px;
        }

        .forgot-otp-input {
            width: 48px;
            height: 56px;
            padding: 0;
            border: 1.5px solid #C9D6E2;
            border-radius: 8px;
            background: #F5F8FC;
            color: #004179;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
        }

        .forgot-otp-input:focus {
            outline: none;
            border-color: #F4B400;
            background: white;
            box-shadow: 0 0 0 2px rgba(244, 180, 0, .12);
        }

        .forgot-message {
            min-height: 24px;
            margin-top: 16px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            color: #004179;
        }

        .forgot-message.error {
            color: #B42318;
        }

        .forgot-back {
            margin-top: 24px;
            text-align: center;
        }

        .forgot-back a {
            color: #004179;
            font-weight: 600;
            text-decoration: none;
        }

        .forgot-back a:hover {
            color: #D39F00;
            text-decoration: underline;
        }

        #otpSection,
        #passwordSection {
            display: none;
        }

        @media (max-width: 700px) {
            .forgot-reset-card {
                grid-template-columns: 1fr;
            }

            .forgot-brand {
                padding: 26px 24px;
            }

            .forgot-brand h1 {
                font-size: 28px;
            }

            .forgot-brand p {
                margin-bottom: 0;
            }

            .forgot-form-panel {
                padding: 30px 22px;
            }

            .forgot-otp-row {
                gap: 6px;
            }

            .forgot-otp-input {
                width: min(12vw, 45px);
                height: 50px;
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
    <main class="forgot-reset-page">
        <div class="forgot-reset-card">

            <aside class="forgot-brand">
                <h1>EduMetrics</h1>
                <p>Academic Assessment &amp; Grading System</p>
                <p>Securely recover your account and create a new password.</p>
            </aside>

            <section class="forgot-form-panel">
                <h2 id="pageHeading">Forgot Password?</h2>
                <p class="forgot-description" id="pageDescription">
                    Enter your registered email address to receive a six-digit
                    password reset code.
                </p>

                <form id="emailForm">
                    <label class="forgot-field" for="email">Email Address</label>
                    <input class="forgot-input" id="email" type="email" autocomplete="email"
                        placeholder="Enter your registered email" required>
                    <button class="forgot-button" id="sendButton" type="submit">
                        Send OTP
                    </button>
                </form>

                <form id="otpSection">
                    <label class="forgot-field">Enter Verification Code</label>
                    <div class="forgot-otp-row">
                        <input class="forgot-otp-input" aria-label="Digit 1" inputmode="numeric" maxlength="1" required>
                        <input class="forgot-otp-input" aria-label="Digit 2" inputmode="numeric" maxlength="1" required>
                        <input class="forgot-otp-input" aria-label="Digit 3" inputmode="numeric" maxlength="1" required>
                        <input class="forgot-otp-input" aria-label="Digit 4" inputmode="numeric" maxlength="1" required>
                        <input class="forgot-otp-input" aria-label="Digit 5" inputmode="numeric" maxlength="1" required>
                        <input class="forgot-otp-input" aria-label="Digit 6" inputmode="numeric" maxlength="1" required>
                    </div>

                    <button class="forgot-button" id="verifyButton" type="submit">
                        Verify OTP
                    </button>
                    <button class="forgot-button" id="resendButton" type="button">
                        Resend OTP
                    </button>
                </form>

                <section id="passwordSection">
                    <form id="passwordForm">

                        <label class="forgot-field" for="newPassword">
                            New Password
                        </label>
                        <div class="password-wrapper">
                            <input class="forgot-input" id="newPassword" type="password" autocomplete="new-password"
                                minlength="8" placeholder="Enter new password" required>
                            <button type="button" class="toggle-password" data-target="newPassword"
                                aria-label="Show new password" aria-pressed="false">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>

                        <label class="forgot-field" for="confirmPassword">
                            Confirm Password
                        </label>
                        <div class="password-wrapper">
                            <input class="forgot-input" id="confirmPassword" type="password" autocomplete="new-password"
                                minlength="8" placeholder="Re-enter new password" required>
                            <button type="button" class="toggle-password" data-target="confirmPassword"
                                aria-label="Show confirm password" aria-pressed="false">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>

                        <button class="forgot-button" id="resetButton" type="submit">
                            Reset Password
                        </button>
                    </form>
                </section>

                <p id="message" class="forgot-message" role="status" aria-live="polite"></p>

                <div class="forgot-back">
                    <a href="/login%20page.html" id="backToLogin">Back to Login</a>
                </div>
            </section>
        </div>
    </main>

    <script>
        const emailForm = document.getElementById("emailForm");
        const otpForm = document.getElementById("otpSection");
        const passwordSection = document.getElementById("passwordSection");
        const passwordForm = document.getElementById("passwordForm");
        const emailInput = document.getElementById("email");
        const otpInputs = [...document.querySelectorAll(".forgot-otp-input")];
        const message = document.getElementById("message");
        const pageHeading = document.getElementById("pageHeading");
        const pageDescription = document.getElementById("pageDescription");
        const backToLogin = document.getElementById("backToLogin");

        let verifiedEmail = "";
        let otpVerified = false;


        const params = new URLSearchParams(window.location.search);
        const selectedRole = params.get("role");


        let resendCountdown = null;
        let resendSeconds = 0;

        function startResendCountdown(seconds = 30) {
            const resendButton = document.getElementById("resendButton");

            if (!resendButton) return;

            if (resendCountdown !== null) {
                clearInterval(resendCountdown);
            }

            resendSeconds = seconds;
            resendButton.disabled = true;
            resendButton.textContent = `Resend OTP (${resendSeconds}s)`;

            resendCountdown = setInterval(() => {
                resendSeconds--;

                if (resendSeconds <= 0) {
                    clearInterval(resendCountdown);
                    resendCountdown = null;
                    resendButton.disabled = false;
                    resendButton.textContent = "Resend OTP";
                    return;
                }

                resendButton.textContent = `Resend OTP (${resendSeconds}s)`;
            }, 1000);
        }


        if (backToLogin) {
            const allowedRoles = [
                "student",
                "faculty",
                "department-head",
                "admin-security"
            ];

            const role = allowedRoles.includes(selectedRole)
                ? selectedRole
                : "student";

            backToLogin.href =
                "/login%20page.html?role=" + encodeURIComponent(role);
        }


        function showMessage(text, isError = false) {
            message.textContent = text;
            message.classList.toggle("error", isError);
        }

        async function postJSON(url, body) {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "The request failed.");
            }

            return result;
        }

        emailForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            showMessage("");

            const email = emailInput.value.trim().toLowerCase();
            const button = document.getElementById("sendButton");
            button.disabled = true;

            try {
                const params = new URLSearchParams(window.location.search);
                const role = params.get("role") || "student";

                const result = await postJSON("/api/auth/forgot-password", {
                    email,
                    role
                });

                verifiedEmail = email;
                otpForm.style.display = "block";
                emailForm.style.display = "none";
                pageHeading.textContent = "Verify Your Email";
                pageDescription.textContent =
                    "Enter the six-digit password reset code sent to your email.";
                showMessage(result.message || "Check your email for the reset code.");
                otpInputs[0].focus();
            } catch (error) {
                showMessage(error.message, true);
            } finally {
                button.disabled = false;
            }
        });

        otpInputs.forEach((input, index) => {
            input.addEventListener("input", () => {
                input.value = input.value.replace(/\D/g, "").slice(-1);

                if (input.value && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });

            input.addEventListener("keydown", (event) => {
                if (event.key === "Backspace" && !input.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });

            input.addEventListener("paste", (event) => {
                event.preventDefault();
                const digits = event.clipboardData.getData("text")
                    .replace(/\D/g, "").slice(0, 6);

                digits.split("").forEach((digit, i) => {
                    if (otpInputs[i]) otpInputs[i].value = digit;
                });

                otpInputs[Math.min(digits.length, 5)].focus();
            });
        });

        otpForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            showMessage("");

            const token = otpInputs.map(input => input.value).join("");
            if (token.length !== 6) {
                showMessage("Enter the complete six-digit code.", true);
                return;
            }

            const button = document.getElementById("verifyButton");
            button.disabled = true;

            try {
                const result = await postJSON("/api/auth/verify-otp", {
                    email: verifiedEmail,
                    token,
                    purpose: "reset_password"
                });

                if (result.status !== "reset_verified") {
                    throw new Error("The reset code was not verified.");
                }

                otpVerified = true;
                otpForm.style.display = "none";
                passwordSection.style.display = "block";
                pageHeading.textContent = "Create New Password";
                pageDescription.textContent =
                    "Your code is verified. Enter and confirm your new password.";
                showMessage("Email verified successfully.");
            } catch (error) {
                showMessage(error.message, true);
            } finally {
                button.disabled = false;
            }
        });

        document.getElementById("resendButton").addEventListener("click", async () => {
            showMessage("");
            const button = document.getElementById("resendButton");
            button.disabled = true;

            try {
                const params = new URLSearchParams(window.location.search);
                const role = params.get("role") || "student";

                await postJSON("/api/auth/forgot-password", {
                    email: verifiedEmail,
                    role: role
                });

                startResendCountdown(30);

                otpInputs.forEach(input => input.value = "");
                showMessage("If the account exists, a new reset code has been requested.");
                otpInputs[0].focus();
            } catch (error) {
                showMessage(error.message, true);
            } finally {
                button.disabled = false;
            }
        });

        passwordForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            showMessage("");

            if (!otpVerified) {
                showMessage("Verify your reset code first.", true);
                return;
            }

            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (newPassword.length < 8) {
                showMessage("Password must contain at least 8 characters.", true);
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage("Passwords do not match.", true);
                return;
            }

            const button = document.getElementById("resetButton");
            button.disabled = true;

            try {
                const result = await postJSON("/api/auth/reset-password", {
                    newPassword,
                    confirmPassword
                });

                showMessage(result.message || "Password updated successfully.");
                passwordForm.reset();
                passwordSection.style.display = "none";
                pageHeading.textContent = "Password Updated";
                pageDescription.textContent =
                    "You can now return to login using your new password.";
            } catch (error) {
                showMessage(error.message, true);
            } finally {
                button.disabled = false;
            }
        });


        document.querySelectorAll(".toggle-password").forEach((button) => {
            button.addEventListener("click", () => {
                const input = document.getElementById(button.dataset.target);
                const isHidden = input.type === "password";

                input.type = isHidden ? "text" : "password";
                button.setAttribute("aria-pressed", String(isHidden));
                button.setAttribute(
                    "aria-label",
                    `${isHidden ? "Hide" : "Show"} ${input.id === "newPassword"
                        ? "new password"
                        : "confirm password"
                    }`
                );
            });
        });


    </script>
</body>

</html>
