<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password | EduMetrics</title>
  <link rel="stylesheet" href="../static/style.css">
</head>
<body>
  <main class="app-shell">
    <header class="site-header">
      <a class="brand" href="forgot-password.html" aria-label="EduMetrics home"><span>Edu</span>Metrics<small>Academic Assessment &amp; Grading System</small></a>
      <nav class="header-actions" aria-label="Account"><a class="support" href="mailto:support@edumetrics.edu"><svg class="support-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13v-2a9 9 0 0 1 18 0v2"/><rect x="3" y="12" width="4" height="7" rx="2"/><rect x="17" y="12" width="4" height="7" rx="2"/><path d="M19 19a3 3 0 0 1-3 3h-3"/><rect x="10" y="20" width="4" height="2" rx="1"/></svg><span>Help &amp; Support</span></a><span class="role-pill">Student</span></nav>
    </header>
    <a class="page-back" href="javascript:history.back()"><span aria-hidden="true">‹</span> back</a>
    <section class="auth-card forgot-card" aria-labelledby="page-title">
      <div class="hero-icon"><svg viewBox="0 0 80 80" aria-hidden="true"><path d="M24 34v-9a16 16 0 0 1 32 0v9"/><rect x="12" y="34" width="56" height="36" rx="7"/><path d="M29 51v2m11-2v2m11-2v2"/></svg></div>
      <h1 id="page-title">Forgot Password?</h1>
      <p class="intro">Enter your email address and we’ll you a<br class="desktop-break"> verification code to reset your password.</p>
      <form class="form-stack" action="verify-email.html">
        <label class="input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m3 6 9 7 9-7"/></svg><input type="email" placeholder="Enter your email" aria-label="Email address" required></label>
        <div class="notice"><span class="notice-icon">!</span><span>We’ll send a verification code to your registered email address.<br class="desktop-break"> Please check your inbox or spam folder.</span></div>
        <button class="primary-button" type="submit">Send Verification Code</button>
      </form>
    </section>
  </main>
</body>
</html>
